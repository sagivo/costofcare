name: Daily public source catalogs and benchmarks
on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-catalogs
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/refresh_public_sources.py
      - name: Refresh row-preserving primary pilot
        run: python scripts/normalize_mrf.py --id avala --url https://avala.com/wp-content/uploads/2026/03/721426390_fairway-medical-center_standardcharges.csv
      - name: Generate structural quality metrics
        run: python scripts/quality_report.py
      - uses: actions/checkout@v4
        with:
          path: publication
          ref: main
      - name: Publish catalog snapshots
        run: |
          cp -a data/catalogs publication/data/
          cp -a data/reference publication/data/
          cp -a data/normalized publication/data/
          cd publication
          python scripts/quality_report.py
          cd ..
          cd publication
          git config user.name 'CostOfCare public sources'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogs data/reference data/normalized data/quality
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh public source catalogs and benchmarks'
          git push origin HEAD:main
