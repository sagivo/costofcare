name: Daily public source catalogs and benchmarks
on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-catalogs
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_public_sources.py
      - uses: actions/checkout@v4
        with:
          path: publication
          ref: main
      - name: Publish catalog snapshots
        run: |
          cp -a data/catalogs publication/data/
          cp -a data/reference publication/data/
          cd publication
          git config user.name 'CostOfCare public sources'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogs data/reference
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh public source catalogs and benchmarks'
          git push origin HEAD:main
