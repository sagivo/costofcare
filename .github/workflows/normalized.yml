name: Daily row-preserving primary extraction
on:
  schedule:
    - cron: '31 10 * * *'
    - cron: '31 22 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Primary files in this bounded tranche
        default: '120'
        required: true
      only_unattempted:
        description: Skip files already attempted
        default: 'false'
        required: true
      retry_failed:
        description: Only retry sources whose last attempt failed
        default: 'false'
        required: true
      source_timeout:
        description: Seconds allowed per source
        default: '240'
        required: true
permissions:
  contents: write
concurrency:
  group: normalized-primary
  cancel-in-progress: false
jobs:
  normalized:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/test_normalized.py
      - run: python scripts/refresh_normalized.py --limit "${{ github.event.inputs.limit || '120' }}" ${{ github.event.inputs.only_unattempted == 'true' && '--only-unattempted' || '' }} ${{ github.event.inputs.retry_failed == 'true' && '--retry-failed' || '' }} --source-timeout "${{ github.event.inputs.source_timeout || '240' }}"
      - run: python scripts/validate_normalized.py
      - run: python scripts/release_publish.py --data-dir data/normalized --release-prefix data-norm --limit 260
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: publication
          ref: main
      - name: Publish normalized data and current measured QA
        run: |
          cp -a data/normalized publication/data/
          cp -a data/normalized-attempts publication/data/
          cp -a data/quality publication/data/ 2>/dev/null || true
          cd publication
          python scripts/quality_report.py
          python scripts/validate_normalized.py
          python scripts/semantic_qa.py
          python scripts/lineage_report.py
          git config user.name 'CostOfCare normalized data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/normalized ':(exclude)data/normalized/*.jsonl.gz' data/normalized-attempts data/quality
          report="data/quality/release-publish-data-norm.json"
          if [ ! -f "$report" ]; then
            echo "::error::publish report $report is missing; refusing to publish without it"
            exit 1
          fi
          if ! jq -e '(.missing_files | type) == "array"' "$report" >/dev/null; then
            echo "::error::publish report $report has no missing_files array"
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "data/normalized/$name" ]; then
              echo "PUBLISH-FALLBACK: committing unpublished blob $name to preserve data"
              git add -f "data/normalized/$name"
            else
              echo "::warning::PUBLISH-FALLBACK: unpublished blob $name not found in data/normalized"
            fi
          done < <(jq -r '.missing_files[]' "$report")
          # release assets are canonical; drop unstaged tracked-blob changes so rebase works
          git checkout -- 'data/normalized/*.jsonl.gz' || true
          git diff --cached --quiet && exit 0
          git commit -m 'data: row-preserving primary extraction tranche'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 20
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo "push did not land after retries"; exit 1; }
