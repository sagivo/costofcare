name: Daily primary-source price refresh
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand primary-source discovery
        run: python scripts/discover_sources.py
      - name: Download and parse hospital-published MRFs
        run: python scripts/refresh_dataset.py --workers 4 --max-mb 700 --registry data/registry.json
      - name: Build search dataset
        if: always()
        run: python scripts/build_dataset.py
      - name: Publish successful snapshots and failure audit
        if: always()
        run: |
          git config user.name 'CostOfCare data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/data src/data/summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: daily primary-source refresh'
          git pull --rebase origin main
          git push origin HEAD:main
