name: Daily primary-source price refresh
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Number of source files to attempt (0 for all)
        default: '30'
        required: true
permissions:
  contents: write
concurrency:
  group: price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand primary-source discovery
        run: python scripts/discover_sources.py
      - name: Download and parse hospital-published MRFs
        run: python scripts/refresh_dataset.py --limit "${{ github.event.inputs.limit || '0' }}" --max-minutes 240 --workers 4 --max-mb 700 --registry data/registry.json
      - name: Build search dataset
        if: always()
        run: python scripts/build_dataset.py
      - name: Check out current publication branch
        if: always()
        uses: actions/checkout@v4
        with:
          path: publication
          ref: main
      - name: Publish snapshots on current branch
        if: always()
        run: |
          python scripts/merge_refresh.py publication
          cd publication
          python scripts/build_dataset.py
          python scripts/quality_report.py
          git config user.name 'CostOfCare data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/data src/data/summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: daily primary-source refresh'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 20
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo "push did not land after retries"; exit 1; }
