name: Daily insurer TiC in-network tranche
on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: TiC files in this bounded tranche
        default: '20'
        required: true
      min_bytes:
        description: Skip locator files smaller than this (empty shells first)
        default: '50000'
        required: true
      max_bytes:
        description: Only files up to this many bytes
        default: '5000000'
        required: true
      source_timeout:
        description: Seconds allowed per source
        default: '120'
        required: true
permissions:
  contents: write
concurrency:
  group: tic-tranche
  cancel-in-progress: false
jobs:
  tic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/tic_refresh.py --limit "${{ github.event.inputs.limit || '20' }}" --min-bytes "${{ github.event.inputs.min_bytes || '50000' }}" --max-bytes "${{ github.event.inputs.max_bytes || '5000000' }}" --source-timeout "${{ github.event.inputs.source_timeout || '120' }}"
      - run: python scripts/tic_provider_lookup.py --cap 100
      - run: python scripts/release_publish.py --data-dir data/tic --release-prefix data-tic --limit 50
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: publication
          ref: main
      - name: Publish TiC tranche
        run: |
          mkdir -p publication/data
          cp -a data/tic publication/data/ 2>/dev/null || true
          cp -a data/tic-attempts publication/data/ 2>/dev/null || true
          cp -a data/tic-providers publication/data/ 2>/dev/null || true
          cp -a data/quality publication/data/ 2>/dev/null || true
          cd publication
          git config user.name 'CostOfCare TiC data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/tic ':(exclude)data/tic/*.jsonl.gz' data/tic-attempts data/tic-providers data/quality
          report="data/quality/release-publish-data-tic.json"
          if [ ! -f "$report" ]; then
            echo "::error::publish report $report is missing; refusing to publish without it"
            exit 1
          fi
          if ! jq -e '(.missing_files | type) == "array"' "$report" >/dev/null; then
            echo "::error::publish report $report has no missing_files array"
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f "data/tic/$name" ]; then
              echo "PUBLISH-FALLBACK: committing unpublished blob $name to preserve data"
              git add -f "data/tic/$name"
            else
              echo "::warning::PUBLISH-FALLBACK: unpublished blob $name not found in data/tic"
            fi
          done < <(jq -r '.missing_files[]' "$report")
          # release assets are canonical; drop unstaged tracked-blob changes so rebase works
          git checkout -- 'data/tic/*.jsonl.gz' || true
          git diff --cached --quiet && exit 0
          git commit -m 'data: insurer TiC in-network bounded tranche'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 20
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" || { echo "push did not land after retries"; exit 1; }
